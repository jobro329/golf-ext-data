name: Course weather (Open-Meteo)

on:
  schedule:
    # Monday 09:47 UTC (before the Monday model run) and Wednesday 21:47 UTC (before the Wednesday closing run)
    - cron: "47 9 * * 1"
    - cron: "47 21 * * 3"
  workflow_dispatch:
    inputs:
      mode:
        description: "forecast (normal) or history (one-time backfill of past events)"
        required: true
        default: "forecast"

permissions:
  contents: write

concurrency:
  group: weather
  cancel-in-progress: false

jobs:
  weather:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pyreadr

      - name: Pull weather
        run: python scripts/pull_weather.py "${{ github.event.inputs.mode || 'forecast' }}"

      - name: Commit (retries if another workflow pushed at the same time)
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weather
          if git diff --staged --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Weather $(date -u +%F): ${{ github.event.inputs.mode || 'forecast' }}"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          exit 1
